<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minecraft Field Notes</title>
  <link rel="icon" href="assets/app-icon.png">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="components.css">
</head>
<body>
  <main class="shell">
    <header class="titlebar">
      <div class="brand"><img src="assets/app-icon.png" alt="" width="22" height="22"><h1>Field Notes</h1></div>
      <div class="titlebar-actions">
        <button id="pinBtn" class="icon-button" title="Keep window on top" data-icon="thumbtack"></button>
        <button id="closeBtn" class="icon-button" title="Hide to tray" data-icon="close"></button>
      </div>
    </header>

    <div class="worldbar">
      <label for="worldSelect">World</label>
      <select id="worldSelect"></select>
    </div>

    <nav class="tabs" role="tablist">
      <button class="tab active" role="tab" data-tab="capture">Capture</button>
      <button class="tab" role="tab" data-tab="journal">Journal <span id="journalCount" class="count"></span></button>
      <button class="tab" role="tab" data-tab="worlds">Worlds</button>
    </nav>

    <section id="pane-capture" class="pane active" data-pane="capture">
      <div class="stamp" id="coordsDisplay">
        <span class="stamp-label">Coordinates</span>
        <span class="stamp-value" id="coordsValue">Press Ctrl + Alt + C in Minecraft</span>
      </div>
      <div id="captureForm" class="form">
        <label>Name<input id="wpName" placeholder="Home, spawner, village..." autocomplete="off"></label>
        <div class="grid two">
          <label>Category
            <span class="select-with-icon"><span id="catPreview" class="select-icon"></span><select id="wpCategory"></select></span>
          </label>
          <label>Dimension
            <select id="wpDimension"><option value="overworld">Overworld</option><option value="nether">Nether</option><option value="the_end">The End</option></select>
          </label>
        </div>
        <label>Notes<textarea id="wpDescription" rows="3" placeholder="Optional notes"></textarea></label>
        <div id="conversionDisplay" class="conversion">Portal target: —</div>
        <div class="actions">
          <label class="check"><input type="checkbox" id="wpFavorite"> Pin to top</label>
          <button id="saveBtn" class="primary">Save waypoint</button>
        </div>
        <p class="hint"><kbd>Enter</kbd> saves and returns to Minecraft · <kbd>Esc</kbd> discards</p>
      </div>
    </section>

    <section id="pane-journal" class="pane" data-pane="journal">
      <div class="searchbox"><span data-icon="search"></span><input id="searchInput" placeholder="Search this world's waypoints" autocomplete="off"></div>
      <div id="journalList" class="journal-list"></div>
    </section>

    <section id="pane-worlds" class="pane" data-pane="worlds">
      <div id="worldsPane"></div>
    </section>

    <footer class="statusbar">
      <span id="minecraftStatus" class="status offline"><i></i><span>Waiting for Minecraft</span></span>
      <span id="syncStatus" class="status"><i></i><span>LAN ready</span></span>
    </footer>

    <div id="toast" class="toast" role="status"></div>

    <div id="welcome" class="welcome hidden">
      <div class="welcome-card">
        <img src="assets/app-icon.png" alt="" width="56" height="56">
        <h2>Begin your journal</h2>
        <p>Every Minecraft world gets its own pages. What is your first world called?</p>
        <input id="welcomeName" placeholder="e.g. Survival Realm" autocomplete="off">
        <button id="welcomeCreate" class="primary">Start journal</button>
        <p id="welcomeError" class="error"></p>
      </div>
    </div>
  </main>
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
